name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned file comes with #15; requirements.txt lists packages that do not install (#21).
      - name: Install
        run: pip install ruff flask flask-sqlalchemy pytest

      # Bug classes only: syntax errors, undefined names, invalid comparisons. No style rules.
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 --output-format github .

      - name: Test
        working-directory: "Payment's Pipeline/payment_pipeline"
        run: python -m pytest -q
